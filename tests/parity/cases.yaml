# The rg parity cases (ADR-0021, spec of STORY-65). One entry for each case.
#
#   id          the name of the case; unique
#   args        the arguments of rg and jag, one YAML string for each argument
#   tree        the fixture tree in tests/parity/fixtures
#   modes       pipe, color, terminal; default: all three
#   stdin       a file in tests/parity/stdin; default: /dev/null
#   env         extra variables of the environment
#   deliberate  a recorded difference: answer names the user ANSWER; the stored
#               jag bytes are in tests/parity/expected/<id>/

- id: one-file
  args: ["foo", "a.txt"]
  tree: basic
- id: two-files
  args: ["--sort", "path", "foo", "a.txt", "sub/c.txt"]
  tree: basic
- id: folder
  args: ["--sort", "path", "foo", "sub"]
  tree: basic
- id: dot
  args: ["--sort", "path", "foo", "."]
  tree: basic
- id: no-path
  args: ["--sort", "path", "foo"]
  tree: basic
- id: args-order
  args: ["--sort", "path", "foo", "sub/c.txt", "a.txt", "b.rs"]
  tree: basic
- id: walk-order
  args: ["--sort", "path", "x", "."]
  tree: order
- id: no-match
  args: ["zzz", "a.txt"]
  tree: basic
- id: ignore-case
  args: ["-i", "foo", "a.txt"]
  tree: basic
- id: word
  args: ["-w", "foo", "a.txt"]
  tree: basic
- id: fixed
  args: ["-F", "f.o", "a.txt"]
  tree: basic
- id: regex
  args: ["f.o", "a.txt"]
  tree: basic
- id: two-e
  args: ["-e", "alpha", "-e", "gamma", "a.txt"]
  tree: basic
- id: e-dash
  args: ["-e", "-x", "a.txt"]
  tree: basic
- id: double-dash
  args: ["--", "-x", "a.txt"]
  tree: basic
- id: empty-term
  args: ["", "a.txt"]
  tree: basic
- id: after
  args: ["-A", "1", "foo", "ctx.txt"]
  tree: basic
- id: before
  args: ["-B", "2", "foo", "ctx.txt"]
  tree: basic
- id: context
  args: ["-C", "1", "foo", "ctx.txt"]
  tree: basic
- id: context-two
  args: ["--sort", "path", "-C", "1", "foo", "a.txt", "ctx.txt"]
  tree: basic
- id: files
  args: ["--sort", "path", "-l", "foo", "a.txt", "b.rs", "empty.txt"]
  tree: basic
- id: count-one
  args: ["-c", "foo", "a.txt"]
  tree: basic
- id: count-many
  args: ["--sort", "path", "-c", "foo", "a.txt", "b.rs", "empty.txt"]
  tree: basic
- id: quiet
  args: ["-q", "foo", "a.txt"]
  tree: basic
- id: quiet-miss
  args: ["-q", "zzz", "a.txt"]
  tree: basic
- id: crlf
  args: ["foo", "crlf.txt"]
  tree: basic
- id: no-newline
  args: ["foo", "nonl.txt"]
  tree: basic
- id: utf8
  args: ["foo", "utf8.txt"]
  tree: basic
- id: latin1
  args: ["foo", "latin1.txt"]
  tree: basic
- id: hidden-file
  args: ["foo", ".hidden.txt"]
  tree: basic
- id: binary-file
  args: ["foo", "bin.dat"]
  tree: basic
- id: binary-late
  args: ["foo", "late.bin"]
  tree: binary
- id: binary-walk
  args: ["--sort", "path", "foo", "."]
  tree: binary
- id: ignore-files
  args: ["--sort", "path", "foo", "."]
  tree: ignore
- id: stdin
  args: ["foo"]
  tree: basic
  stdin: lines.txt
- id: stdin-dash
  args: ["foo", "-"]
  tree: basic
  stdin: lines.txt
- id: stdin-and-file
  args: ["--sort", "path", "foo", "-", "a.txt"]
  tree: basic
  stdin: lines.txt
- id: color-space
  args: ["--color", "always", "foo", "a.txt"]
  tree: basic
  modes: [pipe]
- id: color-never
  args: ["--color", "never", "foo", "a.txt"]
  tree: basic
  modes: [terminal]
- id: no-color-env
  args: ["foo", "a.txt"]
  tree: basic
  modes: [terminal]
  env: {NO_COLOR: "1"}
- id: term-dumb
  args: ["foo", "a.txt"]
  tree: basic
  modes: [terminal]
  env: {TERM: "dumb"}
- id: missing-path
  args: ["foo", "nope.txt"]
  tree: basic
- id: missing-and-match
  args: ["--sort", "path", "foo", "nope.txt", "a.txt"]
  tree: basic
- id: quiet-missing
  args: ["-q", "--sort", "path", "foo", "nope.txt", "a.txt"]
  tree: basic
- id: empty-path
  args: ["foo", ""]
  tree: basic
- id: bad-regex
  args: ["(", "a.txt"]
  tree: basic
- id: no-args
  args: []
  tree: basic
  modes: [pipe]
- id: bad-number
  args: ["-A", "x", "foo", "a.txt"]
  tree: basic
  modes: [pipe]
- id: missing-value
  args: ["foo", "a.txt", "-A"]
  tree: basic
  modes: [pipe]
- id: color-bad
  args: ["--color", "foo", "a.txt"]
  tree: basic
  modes: [pipe]
- id: sort-bad
  args: ["--sort", "size", "foo", "a.txt"]
  tree: basic
  modes: [pipe]
- id: look-around
  args: ["a(?=b)", "a.txt"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card E (F23-Q7), option 1"
- id: newline
  args: ["a\\nb", "a.txt"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card E (F23-Q7), option 1"
- id: nothing-searched
  args: ["foo"]
  tree: hidden-only
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card E (F23-Q7), option 1"
- id: unknown-option
  args: ["--frobnicate", "foo", "a.txt"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card E (F23-Q7), option 1"
- id: glob
  args: ["--sort", "path", "-g", "*.txt", "foo", "."]
  tree: basic
- id: glob-not
  args: ["--sort", "path", "-g", "!*.txt", "foo", "."]
  tree: basic
- id: include
  args: ["--include", "*.txt", "foo", "sub"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card E (F23-Q7), option 1"
- id: colour
  args: ["--colour=always", "foo", "a.txt"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card E (F23-Q7), option 1"
- id: line-number
  args: ["-n", "foo", "a.txt"]
  tree: basic
- id: no-line-number
  args: ["-N", "--sort", "path", "foo", "a.txt", "sub/c.txt"]
  tree: basic
- id: with-filename
  args: ["-H", "foo", "a.txt"]
  tree: basic
- id: no-filename
  args: ["-I", "--sort", "path", "foo", "a.txt", "sub/c.txt"]
  tree: basic
- id: heading
  args: ["--heading", "--sort", "path", "foo", "a.txt", "sub/c.txt"]
  tree: basic
- id: no-heading
  args: ["--no-heading", "--sort", "path", "foo", "a.txt", "sub/c.txt"]
  tree: basic
- id: sort-none
  args: ["--sort", "none", "foo", "a.txt"]
  tree: basic
- id: sort-modified
  args: ["--sort", "modified", "foo", "a.txt"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card C (F23-Q5), option 1"
- id: rg-only-option
  args: ["-v", "foo", "a.txt"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card C (F23-Q5), option 1"
- id: long-line
  args: ["foo", "long.txt"]
  tree: limits
- id: many
  args: ["foo", "many.txt"]
  tree: limits
- id: limits-walk
  args: ["--sort", "path", "foo", "."]
  tree: limits
- id: max-chars
  args: ["--max-chars", "1000", "foo", "many.txt"]
  tree: limits
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card A (F23-Q3), option 1"
- id: help-short
  args: ["-h"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card A (F23-Q3), option 1"
- id: help-long
  args: ["--help"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card A (F23-Q3), option 1"
- id: version
  args: ["--version"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card A (F23-Q3), option 1"
- id: json
  args: ["--json", "foo", "a.txt"]
  tree: basic
  modes: [pipe]
  deliberate:
    answer: "hitl ANSWER of 2026-10-15, card D (F23-Q6), option 1"
