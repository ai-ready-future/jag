name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain that rust-toolchain.toml pins.
      - name: Install the toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-features -- -D warnings
      # The pinned rg for the rg parity test (ADR-0021). GitHub sets CI, so the
      # test fails when JAG_PARITY_RG is not set.
      - name: Install the pinned rg
        run: |
          set -euo pipefail
          rg=$(scripts/parity/install-rg.sh "$RUNNER_TEMP/rg")
          echo "JAG_PARITY_RG=$rg" >> "$GITHUB_ENV"
      - run: cargo test --locked --all-features
      - run: cargo test --locked --release --test speed

  # The install test of the agent skill (FEATURE-24). Not a required check.
  agent-skill:
    name: agent-skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: node --test tests/agent_skill/install.test.js
        env:
          DO_NOT_TRACK: "1"

  # The tests of the release tools (FEATURE-18). Not a required check.
  release-tools:
    name: release-tools (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '18'
          - os: ubuntu-24.04
            node: '24'
          - os: macos-15
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - run: python3 -I -m unittest discover -s scripts/release -p 'test_*.py'
      - run: node --test npm/jag/test/launcher.test.js
