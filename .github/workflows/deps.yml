name: deps

# The advisories, the licenses, and the npm audit of the dependencies
# (FEATURE-22 spec). This is not a required check: a new advisory can fail it
# with no change in the pull request. The job "deps" of release.yml runs the
# same script before a release.
#
# No schedule event: the Actions policy allows only pull_request,
# pull_request_target, push, and workflow_dispatch.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    name: deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: scripts/deps/check.sh
